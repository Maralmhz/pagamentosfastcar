<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Porto Mais | Fast Car — Pagamentos</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#233047;font:14px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px}header{display:grid;grid-template-columns:140px 1fr 160px;align-items:center;gap:24px;background:white;padding:20px 28px;border:1px solid #e5e7ed;border-bottom:3px solid #252478;border-radius:10px}header img{width:100%;height:85px;object-fit:contain}header div{text-align:center}h1{margin:0;font-size:23px;color:#252478}header p{margin:6px 0 0;font-size:12px;color:#8a91a0}.toolbar{display:flex;justify-content:flex-end;gap:8px;margin:18px 0}button,input,select,textarea{font:inherit}button{border:1px solid #dfe3eb;background:white;border-radius:6px;padding:8px 12px;color:#35405b;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#252478;color:white;border-color:#252478}.danger{color:#b62332}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric{background:white;padding:15px 18px;border:1px solid #e5e7ed;border-radius:8px}.metric small{display:block;color:#8a91a0}.metric strong{display:block;margin-top:7px;font-size:21px;color:#252478}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters input{flex:1;min-width:180px}input,select,textarea{padding:9px;border:1px solid #dfe3eb;border-radius:6px;max-width:100%;background:white;color:#35405b}.notice,#message,#count{font-size:12px;color:#8a91a0;margin:12px 0}#cards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.nota{background:white;border:1px solid #e5e7ed;border-radius:8px;padding:15px 18px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.identity{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;overflow-wrap:anywhere}.identity b{color:#252478}.muted,.meta{color:#8a91a0;font-size:12px}.meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px}.values{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:#697285}.values strong{color:#252478;font-size:16px}.badge{font-size:11px;padding:4px 9px;border-radius:12px;background:#f3f4f7;white-space:nowrap}.pago{background:#edf8f1;color:#27804c}.vencido{background:#fff0f1;color:#b62332}.agendado{background:#eff0fc;color:#252478}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:12px;padding:5px 9px}details{margin-top:10px;font-size:12px;color:#697285}summary{cursor:pointer}details p{white-space:pre-wrap;overflow-wrap:anywhere}dialog{border:0;border-radius:12px;width:min(580px,94vw);padding:24px;max-height:90vh;overflow:auto}dialog::backdrop{background:#20214488}h2{font-size:19px;color:#252478}label{display:grid;gap:5px;font-size:12px;color:#697285;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}#preview{background:#f5f6f8;border-radius:6px;padding:10px;font-size:12px;line-height:1.8;max-height:160px;overflow:auto}@media(max-width:700px){main{padding:12px}header{grid-template-columns:100px 1fr 110px;padding:12px;gap:10px}header img{height:65px}h1{font-size:16px}header p{font-size:10px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:12px}.metric strong{font-size:18px}.grid{grid-template-columns:1fr;gap:0}.values{gap:8px 14px}.filters select{flex:1;min-width:130px}}@media(max-width:420px){header{grid-template-columns:1fr 1fr}header div{grid-row:2;grid-column:1/-1}header img{max-width:110px;margin:auto}}@media print{body{background:white}.toolbar,.filters,.actions,dialog,.notice{display:none!important}.nota{break-inside:avoid}main{padding:0}}</style></head><body><main><header><img src="/porto.svg" alt="Porto Mais Proteção Veicular"><div><h1>Controle de pagamentos</h1><p>Porto Mais · Fast Car Centro Automotivo</p></div><img src="/fastcar.svg" alt="Fast Car Centro Automotivo"></header><div class="toolbar"><button onclick="print()">Imprimir</button><button class="primary" onclick="nova()">+ Nova nota</button></div><div id="message" role="status"></div><section id="metrics" class="metrics"></section><div class="filters"><input id="search" type="search" placeholder="Buscar NF, veículo ou placa" aria-label="Buscar"><select id="month" aria-label="Mês"><option value="">Todos os meses</option></select><select id="filterStatus" aria-label="Status"><option value="">Todos os status</option><option value="pendente">Pendente</option><option value="agendado">Agendado</option><option value="vencido">Vencido</option><option value="pago">Pago</option></select><select id="origin" aria-label="Origem"><option value="">Todas as origens</option><option value="financeira">Financeira</option><option value="associacao">Associação</option><option value="indefinida">Não informado</option></select></div><p class="notice">Ordenado por vencimento · Geração de parcelas antigas temporariamente indisponível.</p><section id="cards"></section><p id="count"></p></main><dialog id="editor"><form id="form"><h2 id="title">Nova nota</h2><input id="editId" type="hidden"><div class="grid"><label>Veículo<input id="vehicle" required></label><label>Placa<input id="plate"></label><label>Número da NF<input id="nf" required></label><label>Origem<select id="source" required><option value="">Selecione</option><option value="financeira">Antecipada pela financeira</option><option value="associacao">Faturada pela associação</option></select></label><label><span id="amountLabel">Valor total da nota (R$)</span><input id="amount" type="number" min="0.01" step="0.01" required></label><label id="quantityLabel">Quantidade de parcelas<input id="quantity" type="number" min="1" max="120" value="1"></label><label>Vencimento / primeiro vencimento<input id="due" type="date" required></label><label>Agendamento desta / primeira parcela<input id="scheduled" type="date"></label></div><div id="preview"></div><label>Observações<textarea id="notes" rows="3"></textarea></label><div class="footer"><button type="button" onclick="$('editor').close()">Cancelar</button><button id="save" class="primary">Salvar</button></div></form></dialog><dialog id="payment"><form id="paymentForm"><h2>Registrar pagamento</h2><input id="payId" type="hidden"><label>Data<input id="paidDate" type="date" required></label><label>Forma<select id="method"><option>PIX</option><option>Transferência</option><option>Dinheiro</option><option>Cartão</option><option>Boleto</option></select></label><div class="footer"><button type="button" onclick="$('payment').close()">Cancelar</button><button id="paySave" class="primary">Confirmar pagamento</button></div></form></dialog><script>
const $=id=>document.getElementById(id);let data=[],busy=false;const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=v=>v?String(v).slice(0,10):'';const fmt=v=>v?iso(v).split('-').reverse().join('/'):'—';function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const state=i=>i.pagoem?'pago':i.vencimento&&iso(i.vencimento)<today()?'vencido':i.agendado?'agendado':'pendente';const names={pago:'Pago',vencido:'Vencido',agendado:'Agendado',pendente:'Pendente',financeira:'Antecipada pela financeira',associacao:'Faturada pela associação'};
async function api(method,body){const r=await fetch('/api/notas',{method,headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Erro ao acessar o servidor.');return j}
async function load(){try{$('message').textContent='Carregando...';const r=await api('GET');if(!Array.isArray(r))throw Error('Resposta inválida.');data=r;const old=$('month').value,months=[...new Set(data.map(i=>iso(i.vencimento).slice(0,7)).filter(Boolean))].sort();$('month').innerHTML='<option value="">Todos os meses</option>'+months.map(m=>'<option value="'+esc(m)+'">'+m.split('-').reverse().join('/')+'</option>').join('');$('month').value=months.includes(old)?old:'';$('message').textContent='';render()}catch(e){$('message').textContent=e.message}}
function render(){const q=$('search').value.toLowerCase().trim(),m=$('month').value,s=$('filterStatus').value,o=$('origin').value;const list=data.filter(i=>(!q||[i.nf,i.veiculo,i.placa].join(' ').toLowerCase().includes(q))&&(!m||iso(i.vencimento).startsWith(m))&&(!s||state(i)===s)&&(!o||(i.origem||'indefinida')===o)).sort((a,b)=>(iso(a.vencimento)||'9999').localeCompare(iso(b.vencimento)||'9999')||Number(a.id)-Number(b.id));const sum=x=>x.reduce((a,i)=>a+Math.round(Number(i.valor||0)*100),0)/100;$('metrics').innerHTML=[['Total listado',sum(list)],['Em aberto',sum(list.filter(i=>!i.pagoem))],['Vencido',sum(list.filter(i=>state(i)==='vencido'))],['Pago',sum(list.filter(i=>i.pagoem))]].map(([t,v])=>'<div class="metric"><small>'+t+'</small><strong>'+money(v)+'</strong></div>').join('');$('cards').innerHTML=list.map(i=>{const id=Number(i.id);return '<article class="nota"><div class="top"><div class="identity"><b>NF '+esc(i.nf)+'</b><span class="muted">'+esc(i.veiculo)+' · '+esc(i.placa||'Sem placa')+'</span></div><span class="badge '+state(i)+'">'+names[state(i)]+'</span></div><div class="meta"><span>'+esc(names[i.origem]||'Origem não informada')+'</span><span>Parcela '+(i.parcelaatual||1)+'/'+(i.parcelatotal||1)+'</span></div><div class="values"><span>Parcela: <strong>'+money(i.valor)+'</strong></span><span>Total: '+(i.valortotal!=null?money(i.valortotal):'não informado')+'</span><span>Venc.: '+fmt(i.vencimento)+'</span>'+(i.agendado?'<span>Agendado: '+fmt(i.agendado)+'</span>':'')+(i.pagoem?'<span>Pago: '+fmt(i.pagoem)+'</span>':'')+'</div>'+(i.obs?'<details><summary>Ver observações</summary><p>'+esc(i.obs)+'</p></details>':'')+'<div class="actions"><button data-action="edit" data-id="'+id+'">Editar</button><button data-action="'+(i.pagoem?'reopen':'pay')+'" data-id="'+id+'">'+(i.pagoem?'Reabrir':'Pagar')+'</button><button class="danger" data-action="delete" data-id="'+id+'">Excluir</button>'+(Number(i.parcelatotal)>1?'<button disabled title="Correção da geração de parcelas pendente">Gerar parcelas — indisponível</button>':'')+'</div></article>'}).join('');$('count').textContent=list.length+' parcela(s) encontrada(s).'}
function nova(){$('form').reset();$('editId').value='';$('title').textContent='Nova nota';$('amountLabel').textContent='Valor total da nota (R$)';$('quantityLabel').hidden=false;$('quantity').disabled=false;$('source').required=true;$('editor').showModal();preview()}
function edit(i){nova();$('editId').value=i.id;$('title').textContent='Editar parcela '+(i.parcelaatual||1)+'/'+(i.parcelatotal||1);$('vehicle').value=i.veiculo||'';$('plate').value=i.placa||'';$('nf').value=i.nf||'';$('source').value=i.origem||'';$('source').required=false;$('amount').value=i.valor;$('due').value=iso(i.vencimento);$('scheduled').value=iso(i.agendado);$('notes').value=i.obs||'';$('quantityLabel').hidden=true;$('quantity').disabled=true;$('amountLabel').textContent='Valor desta parcela (R$)';preview()}
function preview(){if($('editId').value){$('preview').textContent='Altera somente esta parcela. Total contratado, demais parcelas e pagamentos registrados são preservados.';return}const total=Math.round(Number($('amount').value)*100),n=Number($('quantity').value),date=$('due').value;if(!total||!Number.isInteger(n)||n<1||n>120||total<n||!date){$('preview').textContent='Informe total, quantidade e primeiro vencimento para conferir as parcelas.';return}const [y,m,d]=date.split('-').map(Number),base=Math.floor(total/n);$('preview').innerHTML=Array.from({length:n},(_,k)=>{const dt=new Date(y,m-1+k,1);dt.setDate(Math.min(d,new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate()));return '<div>'+(k+1)+'/'+n+' · '+dt.toLocaleDateString('pt-BR')+' · '+money((k===n-1?total-base*(n-1):base)/100)+'</div>'}).join('')}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;$('save').disabled=true;try{const id=$('editId').value,b={veiculo:$('vehicle').value.trim(),placa:$('plate').value.trim().toUpperCase(),nf:$('nf').value.trim(),origem:$('source').value||null,vencimento:$('due').value,agendado:$('scheduled').value,obs:$('notes').value};if(id){b.id=Number(id);b.valor=Number($('amount').value)}else{b.valorTotal=Number($('amount').value);b.parcelaTotal=Number($('quantity').value)}await api(id?'PUT':'POST',b);$('editor').close();await load()}catch(err){alert(err.message)}finally{busy=false;$('save').disabled=false}});
$('paymentForm').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;$('paySave').disabled=true;try{await api('PUT',{id:Number($('payId').value),acao:'pagar',pagoEm:$('paidDate').value,forma:$('method').value});$('payment').close();await load()}catch(err){alert(err.message)}finally{busy=false;$('paySave').disabled=false}});
$('cards').addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||busy)return;const i=data.find(i=>Number(i.id)===Number(b.dataset.id));if(!i)return;const p=prompt('Digite a senha para continuar:');if(p===null)return;if(p!=='1010'){alert('Senha incorreta.');return}try{if(b.dataset.action==='edit'){edit(i);return}if(b.dataset.action==='pay'){$('payId').value=i.id;$('paidDate').value=today();$('payment').showModal();return}if(b.dataset.action==='reopen'&&confirm('Reabrir somente esta parcela?')){busy=true;await api('PUT',{id:i.id,acao:'reabrir'});await load()}if(b.dataset.action==='delete'&&confirm('Excluir somente esta parcela da NF '+i.nf+'?')){busy=true;await api('DELETE',{id:i.id});await load()}}catch(err){alert(err.message)}finally{busy=false}});
['search','month','filterStatus','origin'].forEach(id=>$(id).addEventListener('input',render));['amount','quantity','due'].forEach(id=>$(id).addEventListener('input',preview));load();
</script></body></html>
