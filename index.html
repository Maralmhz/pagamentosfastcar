<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento - FASTCAR (Vitor Hugo)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:20px;min-height:100vh}
.container{max-width:1200px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.2);overflow:hidden}
.header{background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);color:#fff;padding:24px;text-align:center}
.header img{width:56px;height:56px;border-radius:10px;background:#fff;padding:4px;margin-bottom:10px}
.header h1{font-size:24px;margin-bottom:8px}
.header p{font-size:14px;opacity:.9}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;padding:24px;background:#f8f9fa;border-bottom:1px solid #e0e0e0}
.summary-card{background:#fff;padding:16px;border-radius:8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.summary-card h3{font-size:13px;color:#666;margin-bottom:8px}
.summary-card .value{font-size:22px;font-weight:700;color:#1e3c72}
.summary-card .value.pending{color:#e74c3c}
.summary-card .value.paid{color:#27ae60}
.summary-card .value.scheduled{color:#2980b9}
.filtros{display:flex;gap:12px;flex-wrap:wrap;padding:16px 24px;background:#f8f9fa;border-bottom:1px solid #e0e0e0}
.filtros select{padding:8px 10px;border-radius:6px;border:1px solid #ccc;font-size:13px}
.table-container{overflow-x:auto;padding:24px}
table{width:100%;border-collapse:collapse;font-size:14px}
thead{background:#1e3c72;color:#fff}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid #e0e0e0}
th{font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.5px}
tbody tr:hover{background:#f5f7fa}
.status{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;display:inline-block}
.status.pendente{background:#fee;color:#e74c3c}
.status.pago{background:#e8f8f0;color:#27ae60}
.status.agendado{background:#eaf3fc;color:#2980b9}
.status.vencido{background:#fde2e2;color:#c0392b}
.valor{font-weight:600;color:#1e3c72}
.actions{padding:16px 24px;background:#f8f9fa;border-top:1px solid #e0e0e0;display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:10px 20px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-block;color:#fff}
.btn-primary{background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(30,60,114,.3)}
.btn-success{background:#27ae60}
.btn-success:hover{background:#219a52}
.btn-info{background:#3498db}
.btn-info:hover{background:#2980b9}
.btn-warning{background:#f39c12}
.btn-danger{background:#e74c3c}
.btn-sm{padding:6px 12px;font-size:12px}
@media (max-width:768px){.header h1{font-size:20px}th,td{padding:8px 12px;font-size:13px}.summary{grid-template-columns:1fr 1fr}}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:100}
.modal-overlay.ativo{display:flex}
.modal{background:#fff;padding:24px;border-radius:12px;width:100%;max-width:420px;max-height:90vh;overflow:auto;color:#333}
.modal h2{margin-bottom:10px;font-size:18px;color:#1e3c72}
.modal label{display:block;font-size:12px;color:#666;margin:10px 0 4px}
.modal input,.modal select,.modal textarea{width:100%;padding:8px 10px;border-radius:6px;border:1px solid #ccc;font-size:13px}
.modal-acoes{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
@media print{.actions,.filtros,.header .btn{display:none!important}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<img src="https://raw.githubusercontent.com/Maralmhz/CHECKLIST-FASTCAR-3.0/main/icon-512.png" alt="FASTCAR">
<h1>Controle de Pagamento</h1>
<p>FASTCAR (Vitor Hugo)</p>
</div>
<div class="summary" id="resumo"></div>
<div class="filtros">
<select id="filtroMes"></select>
<select id="filtroStatus">
<option value="">Todos os status</option>
<option value="pendente">Pendente</option>
<option value="agendado">Agendado</option>
<option value="pago">Pago</option>
<option value="vencido">Vencido</option>
</select>
</div>
<div class="table-container">
<table>
<thead>
<tr><th>Data</th><th>Veiculo</th><th>Placa</th><th>NF</th><th>Valor</th><th>Status</th><th>Agendado</th><th>Pago em</th><th>Observacoes</th><th>Acoes</th></tr>
</thead>
<tbody id="tabela"></tbody>
</table>
</div>
<div class="actions">
<button class="btn btn-primary" onclick="window.print()">Imprimir</button>
<button class="btn btn-success" onclick="abrirNovo()">+ Nova nota</button>
</div>
</div>
<div class="modal-overlay" id="modalSenha">
<div class="modal">
<h2>Senha necessaria</h2>
<label>Digite a senha para continuar</label>
<input id="senhaInput" type="password" maxlength="4">
<div class="modal-acoes">
<button class="btn" style="background:#ccc;color:#333" onclick="fecharSenha()">Cancelar</button>
<button class="btn btn-primary" onclick="confirmarSenha()">Confirmar</button>
</div>
</div>
</div>
<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<h2 id="modalTitulo">Nova nota</h2>
<input type="hidden" id="idEdicao">
<label>Veiculo</label>
<input id="mVeiculo">
<label>Placa</label>
<input id="mPlaca" placeholder="Ex: ABC1D23">
<label>Numero da NF</label>
<input id="mNf">
<label>Valor (R$)</label>
<input id="mValor" type="number" step="0.01">
<label>Data de vencimento</label>
<input id="mVencimento" type="date">
<label>Data agendada para pagamento</label>
<input id="mAgendado" type="date">
<label>Observacoes</label>
<textarea id="mObs" rows="2"></textarea>
<div class="modal-acoes">
<button class="btn" style="background:#ccc;color:#333" onclick="fecharModal()">Cancelar</button>
<button class="btn btn-success" onclick="salvarNota()">Salvar</button>
</div>
</div>
</div>
<div class="modal-overlay" id="modalPagOverlay">
<div class="modal">
<h2>Registrar pagamento</h2>
<input type="hidden" id="idPagamento">
<label>Data do pagamento</label>
<input id="pData" type="date">
<label>Forma de pagamento</label>
<select id="pForma">
<option>PIX</option>
<option>Transferencia</option>
<option>Dinheiro</option>
<option>Cartao</option>
<option>Boleto</option>
</select>
<label>Observacoes</label>
<textarea id="pObs" rows="2"></textarea>
<div class="modal-acoes">
<button class="btn" style="background:#ccc;color:#333" onclick="fecharModalPag()">Cancelar</button>
<button class="btn btn-success" onclick="confirmarPagamento()">Confirmar pagamento</button>
</div>
</div>
</div>
</body>
</html>
