<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Porto Mais · Fast Car | Pagamentos</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#253047;font:14px system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:28px}header{background:white;border:1px solid #e6e9f0;border-radius:14px;padding:18px 28px;display:grid;grid-template-columns:145px 1fr 160px;align-items:center;gap:24px}header img{width:100%;height:83px;object-fit:contain}.heading{text-align:center}h1{margin:6px 0;font-size:24px;color:#252478;letter-spacing:-.6px}.heading p{margin:0;color:#8a92a3;font-size:12px}.accent{height:3px;width:48px;margin:12px auto 0;background:#c52637;border-radius:5px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 16px}.toolbar h2{margin:0;font-size:17px;color:#252478}.toolbar p{font-size:12px;color:#8a92a3;margin:4px 0}button,input,select,textarea{font:inherit}button{border:1px solid #e0e4ed;background:white;color:#546078;border-radius:7px;padding:9px 13px;cursor:pointer}button:hover{border-color:#aab3cb;background:#f8f9fc}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:#292778;color:white;border-color:#292778}.primary:hover{background:#201e65;color:white}.danger{color:#bc283c}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:white;border:1px solid #e6e9f0;padding:17px 20px;border-radius:11px}.metric small{font-size:11px;color:#8a92a3}.metric strong{display:block;font-size:23px;margin-top:7px;color:#252478}.metric.alert strong{color:#be3243}.metric.paid strong{color:#2a805f}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0 12px}.filters input{flex:1;min-width:190px}input,select,textarea{border:1px solid #e0e4ed;border-radius:7px;padding:10px 12px;background:white;color:#39455d;max-width:100%}.notice,#message,#count{font-size:12px;color:#8a92a3;margin:12px 0}#cards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.nota{background:white;border:1px solid #e6e9f0;border-radius:10px;padding:17px 20px;min-width:0}.nota:hover{border-color:#c6cde0}.row{display:grid;grid-template-columns:minmax(200px,1.6fr) minmax(130px,1fr) minmax(120px,.8fr) auto;align-items:center;gap:20px}.identity b{font-size:15px;color:#252478}.vehicle{font-size:12px;color:#8a92a3;margin-top:4px;overflow-wrap:anywhere}.label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#8a92a3}.amount{font-size:19px;font-weight:700;color:#252478;margin-top:3px}.date{font-size:13px;color:#47516b;margin-top:4px}.badge{display:inline-block;font-size:11px;padding:5px 10px;border-radius:20px;background:#f3f5f9;color:#788398;white-space:nowrap}.pago{background:#eef8f3;color:#31805e}.vencido{background:#fff0f2;color:#b62e42}.agendado{background:#f0f0fc;color:#4d4b99}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid #f1f3f7;padding-top:12px;margin-top:13px}.meta{display:flex;gap:12px;flex-wrap:wrap;color:#8d95a6;font-size:11px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:11px;padding:6px 9px;border-color:#e9ecf2}details{font-size:12px;color:#8a92a3;margin-top:10px}summary{cursor:pointer}details p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}dialog{border:0;border-radius:14px;width:min(700px,95vw);padding:25px;max-height:91vh;overflow:auto;box-shadow:0 25px 80px #15153633}dialog::backdrop{background:#20214488}dialog h2{color:#252478;font-size:20px;margin:0 0 12px}dialog p{font-size:12px;line-height:1.6}label{display:grid;gap:6px;font-size:12px;color:#788398;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.preview{padding:12px;background:#f6f7fb;border-radius:8px;font-size:12px;line-height:1.8;max-height:280px;overflow:auto}.planline{display:flex;justify-content:space-between;gap:10px;padding:7px;border-bottom:1px solid #e4e7ee}.warning{color:#b62e42;background:#fff2f3;padding:12px;border-radius:8px}.info{color:#697285}.confirm{display:flex;align-items:flex-start;gap:8px}.confirm[hidden]{display:none}.confirm input{width:auto}#formError{color:#b62e42;white-space:pre-wrap}@media(max-width:750px){main{padding:12px}header{padding:15px;grid-template-columns:100px 1fr 110px;gap:12px}header img{height:65px}h1{font-size:17px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:13px}.metric strong{font-size:20px}.row{grid-template-columns:1fr 1fr;gap:14px}.row .status{justify-self:end}.toolbar{flex-wrap:wrap}.filters select{flex:1;min-width:130px}.grid{grid-template-columns:1fr;gap:0}.nota{padding:15px}}@media(max-width:420px){header{grid-template-columns:1fr 1fr}header img{max-width:110px;margin:auto}.heading{grid-row:2;grid-column:1/-1}}@media print{body{background:white}main{padding:0}.toolbar button,.filters,.actions,dialog,.notice{display:none!important}.nota{break-inside:avoid}}</style></head><body><main><header><img src="/porto.svg" alt="Porto Mais"><div class="heading"><h1>Controle de pagamentos</h1><p>Porto Mais · Fast Car Centro Automotivo</p><div class="accent"></div></div><img src="/fastcar.svg" alt="Fast Car"></header><div class="toolbar"><div><h2>Notas e parcelas</h2><p>Valor total da nota dividido pela quantidade de parcelas.</p></div><div><button onclick="print()">Imprimir</button> <button class="primary" onclick="nova()">+ Nova nota</button></div></div><div id="message" role="status"></div><section id="metrics" class="metrics"></section><div class="filters"><input id="search" type="search" placeholder="Buscar NF, veículo ou placa" aria-label="Buscar"><select id="monthFilter" aria-label="Mês"><option value="">Todos os meses</option></select><select id="filterStatus" aria-label="Status"><option value="">Todos os status</option><option value="pendente">Pendente</option><option value="agendado">Agendado</option><option value="vencido">Vencido</option><option value="pago">Pago</option></select><select id="origin" aria-label="Origem"><option value="">Todas as origens</option><option value="financeira">Financeira</option><option value="associacao">Associação</option><option value="indefinida">Não informado</option></select></div><p class="notice">Ordem de vencimento · Editar nota recalcula o plano inteiro. Ajustar parcela altera somente um lançamento.</p><section id="cards"></section><p id="count"></p></main><dialog id="editor"><form id="form"><h2 id="title">Nova nota</h2><p id="editInfo" class="info"></p><div class="grid"><label>Veículo<input id="vehicle" required></label><label>Placa<input id="plate"></label><label>Número da NF<input id="nf" required></label><label>Origem<select id="source" required><option value="">Selecione</option><option value="financeira">Antecipada pela financeira</option><option value="associacao">Faturada pela associação</option></select></label><label><span id="amountLabel">Valor total da nota (R$)</span><input id="amount" type="number" min="0.01" max="999999999" step="0.01" required></label><label id="quantityLabel">Quantidade de parcelas<input id="quantity" type="number" min="1" max="120" value="1" required></label><label><span id="dueLabel">Primeiro vencimento</span><input id="due" type="date" required></label><label id="scheduleLabel">Agendamento desta / primeira parcela<input id="scheduled" type="date"></label></div><label>Observações<textarea id="notes" rows="3"></textarea></label><div id="preview" class="preview"></div><p id="changes" class="info"></p><label id="ackLabel" class="confirm" hidden><input id="ack" type="checkbox"><span>Conferi o total, a quantidade, os vencimentos e as alterações nas parcelas em aberto.</span></label><p id="formError" role="status"></p><div class="footer"><button type="button" onclick="if(!busy)$('editor').close()">Cancelar</button><button id="save" class="primary">Salvar</button></div></form></dialog><dialog id="payment"><form id="paymentForm"><h2>Registrar pagamento</h2><input id="payId" type="hidden"><label>Data<input id="paidDate" type="date" required></label><label>Forma<select id="method"><option>PIX</option><option>Transferência</option><option>Dinheiro</option><option>Cartão</option><option>Boleto</option></select></label><div class="footer"><button type="button" onclick="if(!busy)$('payment').close()">Cancelar</button><button id="paySave" class="primary">Confirmar pagamento</button></div></form></dialog><script>
const $=id=>document.getElementById(id);let data=[],busy=false,mode='new',selected=null,snapshot=null;const cents=v=>Math.round(Number(v)*100),money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),iso=v=>v?String(v).slice(0,10):'',fmt=v=>v?iso(v).split('-').reverse().join('/'):'—';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function month(s,k){const [y,m,d]=s.split('-').map(Number),dt=new Date(Date.UTC(y,m-1+k,1));dt.setUTCDate(Math.min(d,new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0)).getUTCDate()));return dt.toISOString().slice(0,10)}const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&Number.isFinite(Date.parse(s+'T12:00:00Z'))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s;
const state=i=>i.pagoem?'pago':i.vencimento&&iso(i.vencimento)<today()?'vencido':i.agendado?'agendado':'pendente',names={pago:'Pago',vencido:'Vencido',agendado:'Agendado',pendente:'Pendente',financeira:'Antecipada pela financeira',associacao:'Faturada pela associação'};async function request(url,method='GET',body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});let j;try{j=await r.json()}catch(e){throw Error('Resposta inválida. Confira se a publicação terminou.')}if(!r.ok)throw Error(j.error||'Falha ao acessar servidor.');return j}const api=(m,b)=>request('/api/notas',m,b);
async function load(){try{$('message').textContent='Carregando...';data=await api('GET');if(!Array.isArray(data))throw Error('Resposta inválida.');const old=$('monthFilter').value,months=[...new Set(data.map(i=>iso(i.vencimento).slice(0,7)).filter(Boolean))].sort();$('monthFilter').innerHTML='<option value="">Todos os meses</option>'+months.map(m=>'<option value="'+esc(m)+'">'+m.split('-').reverse().join('/')+'</option>').join('');$('monthFilter').value=months.includes(old)?old:'';$('message').textContent='';render()}catch(e){$('message').textContent=e.message}}
function render(){const q=$('search').value.toLowerCase().trim(),m=$('monthFilter').value,s=$('filterStatus').value,o=$('origin').value;const list=data.filter(i=>(!q||[i.nf,i.veiculo,i.placa].join(' ').toLowerCase().includes(q))&&(!m||iso(i.vencimento).startsWith(m))&&(!s||state(i)===s)&&(!o||(i.origem||'indefinida')===o)).sort((a,b)=>(iso(a.vencimento)||'9999').localeCompare(iso(b.vencimento)||'9999')||Number(a.id)-Number(b.id));const sum=x=>x.reduce((a,i)=>a+cents(i.valor||0),0)/100;$('metrics').innerHTML=[['Total listado',sum(list),''],['Em aberto',sum(list.filter(i=>!i.pagoem)),''],['Vencido',sum(list.filter(i=>state(i)==='vencido')),'alert'],['Pago',sum(list.filter(i=>i.pagoem)),'paid']].map(([t,v,c])=>'<div class="metric '+c+'"><small>'+t+'</small><strong>'+money(v)+'</strong></div>').join('');$('cards').innerHTML=list.map(i=>{const id=Number(i.id);return '<article class="nota"><div class="row"><div><div class="identity"><b>NF '+esc(i.nf)+'</b> <span class="badge">'+(i.parcelaatual||1)+'/'+(i.parcelatotal||1)+'</span></div><div class="vehicle">'+esc(i.veiculo)+' · '+esc(i.placa||'Sem placa')+'</div></div><div><div class="label">Valor da parcela</div><div class="amount">'+money(i.valor)+'</div></div><div><div class="label">Vencimento</div><div class="date">'+fmt(i.vencimento)+'</div></div><div class="status"><span class="badge '+state(i)+'">'+names[state(i)]+'</span></div></div><div class="bottom"><div class="meta"><span>'+esc(names[i.origem]||'Origem não informada')+'</span><span>Total: '+(i.valortotal!=null?money(i.valortotal):'não informado')+'</span>'+(i.agendado?'<span>Agendado: '+fmt(i.agendado)+'</span>':'')+(i.pagoem?'<span>Pago: '+fmt(i.pagoem)+'</span>':'')+'</div><div class="actions"><button data-action="note" data-id="'+id+'">Editar nota</button><button data-action="item" data-id="'+id+'">Ajustar parcela</button><button data-action="'+(i.pagoem?'reopen':'pay')+'" data-id="'+id+'">'+(i.pagoem?'Reabrir':'Pagar')+'</button><button data-action="note" data-id="'+id+'">Gerar parcelas</button><button class="danger" data-action="delete" data-id="'+id+'">Excluir parcela</button></div></div>'+(i.obs?'<details><summary>Ver observações</summary><p>'+esc(i.obs)+'</p></details>':'')+'</article>'}).join('');$('count').textContent=list.length+' parcela(s) encontrada(s).'}
function resetEditor(){mode='new';selected=null;snapshot=null;$('form').reset();$('title').textContent='Nova nota';$('amountLabel').textContent='Valor total da nota (R$)';$('dueLabel').textContent='Primeiro vencimento';$('quantityLabel').hidden=false;$('quantity').disabled=false;$('quantity').value=1;$('scheduleLabel').hidden=false;$('scheduled').disabled=false;$('source').required=true;$('ackLabel').hidden=true;$('ack').required=false;$('editInfo').textContent='O total será dividido entre todas as parcelas. Ajustes de centavos ficam na última.';$('formError').textContent='';$('changes').textContent='';$('save').disabled=false;}
function nova(){if(busy)return;resetEditor();$('editor').showModal();preview()}
async function editNote(i){busy=true;try{const snap=await request('/api/plano?id='+Number(i.id));resetEditor();mode='note';selected=i;snapshot=snap;const r=snap.rows.find(r=>Number(r.id)===Number(i.id))||snap.rows[0],first=snap.rows.find(r=>Number(r.parcelaatual||1)===1);$('title').textContent='Editar nota · NF '+i.nf;$('vehicle').value=r.veiculo||'';$('plate').value=r.placa||'';$('nf').value=r.nf||'';$('source').value=r.origem||'';$('amount').value=r.valortotal!=null?r.valortotal:'';$('quantity').value=r.parcelatotal||1;$('due').value=first?iso(first.vencimento):'';$('notes').value=r.obs||'';$('scheduleLabel').hidden=true;$('scheduled').disabled=true;$('ackLabel').hidden=false;$('ack').required=true;$('editInfo').textContent='Altere o total e a quantidade. O plano inteiro será recalculado: 1.500 em 3x = 500 cada. Pagamentos já registrados não serão alterados. Se o total antigo estiver vazio, informe o total real da nota.';$('editor').showModal();preview()}catch(e){alert(e.message)}finally{busy=false}}
function editItem(i){resetEditor();mode='item';selected=i;$('title').textContent='Ajustar parcela '+(i.parcelaatual||1)+'/'+(i.parcelatotal||1);$('vehicle').value=i.veiculo||'';$('plate').value=i.placa||'';$('nf').value=i.nf||'';$('source').value=i.origem||'';$('source').required=false;$('amount').value=i.valor;$('due').value=iso(i.vencimento);$('scheduled').value=iso(i.agendado);$('notes').value=i.obs||'';$('amountLabel').textContent='Valor desta parcela (R$)';$('dueLabel').textContent='Vencimento desta parcela';$('quantityLabel').hidden=true;$('quantity').disabled=true;$('editInfo').textContent='Ajuste individual. Para alterar o total ou a quantidade use Editar nota.';$('editor').showModal();preview()}
function makePlan(){const t=cents($('amount').value),n=Number($('quantity').value),d=$('due').value;if(!Number.isSafeInteger(t)||t<=0||!Number.isInteger(n)||n<1||n>120||t<n||!validDate(d))return null;const base=Math.floor(t/n);return Array.from({length:n},(_,k)=>({numero:k+1,valor:(k===n-1?t-base*(n-1):base)/100,vencimento:month(d,k)}))}
function preview(){if(mode==='item'){$('preview').textContent='Somente esta parcela será atualizada; o pagamento registrado será preservado.';$('changes').textContent='';return true}const plan=makePlan();if(!plan){$('preview').textContent='Informe total, quantidade e primeiro vencimento para conferir a divisão.';$('changes').textContent='';return false}let blocked=false;const rows=snapshot?.rows||[],existing=new Map(rows.map(r=>[Number(r.parcelaatual||1),r]));$('preview').innerHTML=plan.map(p=>{const old=existing.get(p.numero),conflict=old?.pagoem&&(cents(old.valor)!==cents(p.valor)||iso(old.vencimento)!==p.vencimento);if(conflict)blocked=true;return '<div class="planline"><b>'+p.numero+'/'+plan.length+'</b><span>'+fmt(p.vencimento)+'</span><b>'+money(p.valor)+'</b><span>'+esc(conflict?'Pago — alteração bloqueada':old?.pagoem?'Pago — preservado':old?'Atualizar':'Criar')+'</span></div>'}).join('');const removed=rows.filter(r=>Number(r.parcelaatual||1)>plan.length);if(removed.some(r=>r.pagoem))blocked=true;const created=plan.filter(p=>!existing.has(p.numero)).length;$('changes').className=blocked?'warning':'info';$('changes').textContent=blocked?'Este plano muda ou remove uma parcela paga. A gravação será bloqueada. Nenhum pagamento será alterado.':mode==='note'?created+' parcela(s) a criar; '+removed.length+' parcela(s) em aberto a remover; as demais serão atualizadas. Uma cópia anterior será guardada antes de salvar.':'Total: '+money(cents($('amount').value)/100)+' · '+plan.length+' parcela(s).';return !blocked}
$('form').addEventListener('input',e=>{if(e.target.id==='ack')return;$('ack').checked=false;preview()});$('editor').addEventListener('cancel',e=>{if(busy)e.preventDefault()});
$('form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;$('formError').textContent='';if(!preview()){$('formError').textContent='Confira o plano e os pagamentos antes de salvar.';return}const b={veiculo:$('vehicle').value.trim(),placa:$('plate').value.trim().toUpperCase(),nf:$('nf').value.trim(),origem:$('source').value||null,obs:$('notes').value};if(mode==='note'&&!confirm('Salvar o plano da NF '+b.nf+'? As parcelas em aberto serão recalculadas e as excedentes removidas conforme a prévia.'))return;busy=true;$('save').disabled=true;try{if(mode==='note'){await request('/api/plano','POST',{...b,id:selected.id,token:snapshot.token,total:Number($('amount').value),quantidade:Number($('quantity').value),primeiroVencimento:$('due').value})}else if(mode==='item'){await api('PUT',{...b,id:selected.id,valor:Number($('amount').value),vencimento:$('due').value,agendado:$('scheduled').value})}else{await api('POST',{...b,valorTotal:Number($('amount').value),parcelaTotal:Number($('quantity').value),vencimento:$('due').value,agendado:$('scheduled').value})}$('editor').close();await load();$('message').textContent='Salvo. Se estiver filtrando por mês, selecione Todos os meses para ver as parcelas futuras.'}catch(err){$('formError').textContent=err.message}finally{busy=false;$('save').disabled=false}});
$('paymentForm').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;$('paySave').disabled=true;try{await api('PUT',{id:Number($('payId').value),acao:'pagar',pagoEm:$('paidDate').value,forma:$('method').value});$('payment').close();await load()}catch(err){alert(err.message)}finally{busy=false;$('paySave').disabled=false}});
$('cards').addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||busy)return;const i=data.find(i=>Number(i.id)===Number(b.dataset.id));if(!i)return;const p=prompt('Digite a senha para continuar:');if(p===null)return;if(p!=='1010'){alert('Senha incorreta.');return}try{if(b.dataset.action==='note'){await editNote(i);return}if(b.dataset.action==='item'){editItem(i);return}if(b.dataset.action==='pay'){$('payId').value=i.id;$('paidDate').value=today();$('payment').showModal();return}if(b.dataset.action==='reopen'&&confirm('Reabrir somente esta parcela?')){busy=true;await api('PUT',{id:i.id,acao:'reabrir'});await load()}if(b.dataset.action==='delete'&&confirm('Excluir somente esta parcela da NF '+i.nf+'?')){busy=true;await api('DELETE',{id:i.id});await load()}}catch(err){alert(err.message)}finally{busy=false}});
['search','monthFilter','filterStatus','origin'].forEach(id=>$(id).addEventListener('input',render));load();
</script></body></html>
